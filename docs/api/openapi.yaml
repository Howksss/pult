openapi: 3.1.0
info:
  title: Pult API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: |
    Контракт API Pult версии 1. Источник истины для backend, frontend и probe.
    Несовместимые изменения выпускаются как /api/v2, совместимые — как новые поля и эндпоинты в v1.
    Ошибки возвращаются в формате application/problem+json (RFC 9457).
servers:
  - url: http://localhost:8000
tags:
  - name: graph
    description: Граф системы клиента
  - name: checks
    description: Проверки блока и подробности ошибок
  - name: scopes
    description: Область доступа агента — пути репозитория
  - name: probe
    description: Приём результатов проверок с сервера клиента
  - name: service
    description: Служебные эндпоинты
paths:
  /api/health:
    get:
      tags: [service]
      operationId: health
      security: []
      summary: Проверка работоспособности API
      responses:
        "200":
          description: API работает
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/ready:
    get:
      tags: [service]
      operationId: ready
      security: []
      summary: Готовность к работе, включая доступность БД
      responses:
        "200":
          description: API и БД доступны
          content:
            application/json:
              schema:
                type: object
                required: [status, database]
                properties:
                  status:
                    type: string
                    const: ready
                  database:
                    type: string
                    const: ok
        "503":
          description: БД недоступна
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/projects/{project_id}/graph:
    get:
      tags: [graph]
      operationId: getProjectGraph
      security: []
      summary: Граф проекта со статусами блоков
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Блоки, связи и статусы
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Graph"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/projects/{project_id}/blocks:
    post:
      tags: [graph]
      operationId: createBlock
      security: []
      summary: Добавить блок
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockCreate"
      responses:
        "201":
          description: Блок создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Block"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/blocks/{block_id}:
    patch:
      tags: [graph]
      operationId: updateBlock
      security: []
      summary: Изменить имя, описание или положение блока
      parameters:
        - $ref: "#/components/parameters/BlockId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockUpdate"
      responses:
        "200":
          description: Блок изменён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Block"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [graph]
      operationId: deleteBlock
      security: []
      summary: Удалить блок вместе со связями и проверками
      parameters:
        - $ref: "#/components/parameters/BlockId"
      responses:
        "204":
          description: Блок удалён
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/blocks/{block_id}/checks:
    get:
      tags: [checks]
      operationId: listBlockChecks
      security: []
      summary: Проверки блока с последним результатом и историей
      description: |
        Проблемные проверки идут первыми, выключенные — в конце.
        В истории до 40 последних результатов от старых к новым.
      parameters:
        - $ref: "#/components/parameters/BlockId"
      responses:
        "200":
          description: Проверки блока
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockChecks"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [checks]
      operationId: createCheck
      security: []
      summary: Добавить проверку блоку
      description: |
        Цель и настройки проверяются по типу. Адреса во внутренней сети (localhost, частные, link-local)
        отклоняются, если на сервере не включён ALLOW_PRIVATE_TARGETS.
      parameters:
        - $ref: "#/components/parameters/BlockId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckCreate"
      responses:
        "201":
          description: Проверка создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Check"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/checks/{check_id}:
    patch:
      tags: [checks]
      operationId: updateCheck
      security: []
      summary: Изменить проверку
      description: Тип проверки не меняется — для другого типа создаётся новая проверка.
      parameters:
        - $ref: "#/components/parameters/CheckId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckUpdate"
      responses:
        "200":
          description: Проверка изменена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Check"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [checks]
      operationId: deleteCheck
      security: []
      summary: Удалить проверку вместе с историей
      parameters:
        - $ref: "#/components/parameters/CheckId"
      responses:
        "204":
          description: Проверка удалена
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/checks/{check_id}/run:
    post:
      tags: [checks]
      operationId: runCheck
      security: []
      summary: Выполнить проверку сейчас
      description: Только для http, tls, tcp. Остальные присылает сервер клиента — ответ 409.
      parameters:
        - $ref: "#/components/parameters/CheckId"
      responses:
        "200":
          description: Проверка выполнена, результат записан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Check"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Проверку присылает сервер клиента, Pult её не выполняет
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/blocks/{block_id}/scopes:
    get:
      tags: [scopes]
      operationId: listScopes
      security: []
      summary: Область доступа блока
      parameters:
        - $ref: "#/components/parameters/BlockId"
      responses:
        "200":
          description: Пути, отсортированные по алфавиту
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scope"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [scopes]
      operationId: createScope
      security: []
      summary: Добавить путь в область блока
      description: |
        Путь — шаблон glob относительно корня репозитория: `*` — в пределах папки, `**` — любые вложенные папки,
        `?` — один символ. Путь с `/` на конце означает всю папку. Запрещены `/` в начале, `..`, `\` и буквы дисков.
      parameters:
        - $ref: "#/components/parameters/BlockId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScopeCreate"
      responses:
        "201":
          description: Путь добавлен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/scopes/{scope_id}:
    patch:
      tags: [scopes]
      operationId: updateScope
      security: []
      summary: Сменить право на путь
      parameters:
        - $ref: "#/components/parameters/ScopeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScopeUpdate"
      responses:
        "200":
          description: Право изменено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scope"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [scopes]
      operationId: deleteScope
      security: []
      summary: Убрать путь из области
      parameters:
        - $ref: "#/components/parameters/ScopeId"
      responses:
        "204":
          description: Путь убран
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/projects/{project_id}/links:
    post:
      tags: [graph]
      operationId: createLink
      security: []
      summary: Соединить два блока проекта
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkCreate"
      responses:
        "201":
          description: Связь создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Link"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/probe/results:
    post:
      tags: [probe]
      operationId: submitProbeResults
      summary: Принять пачку результатов проверок от probe
      description: |
        Probe на сервере клиента отправляет результаты пачкой.
        Токен проекта передаётся в заголовке X-Probe-Token и даёт право только на этот эндпоинт (NFR-S5).
        Пачка принимается целиком или отклоняется целиком. Если в ней есть проверка чужого проекта
        или несуществующая проверка, ответ 422 со списком таких health_check_id в errors.
        Probe должен убрать эти записи и повторить отправку остальных, иначе данные будут потеряны.
        Задания по расписанию и heartbeat отчитываются этим же запросом одной строкой curl в cron.
        Если такая проверка молчит дольше полутора интервалов, блок получает статус fail («пропущен запуск»).
      security:
        - probeToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProbeBatch"
      responses:
        "202":
          description: Результаты приняты
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
components:
  securitySchemes:
    probeToken:
      type: apiKey
      in: header
      name: X-Probe-Token
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    BlockId:
      name: block_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ScopeId:
      name: scope_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    CheckId:
      name: check_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    NotFound:
      description: Объект не найден
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Нарушена уникальность, например имя блока в проекте
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Токен probe не передан или неверен
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationError:
      description: Тело или параметры запроса не прошли проверку
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
    BlockKind:
      type: string
      enum: [server, scheduled_job, bot, integration, config, storage]
    BlockStatus:
      type: string
      enum: [ok, warn, fail, unknown]
    CheckStatus:
      type: string
      enum: [ok, warn, fail]
    CheckMethod:
      type: string
      enum: [heartbeat, http, log_pattern, exit_code, tls, tcp]
      description: |
        http, tls и tcp выполняет сам Pult. heartbeat, exit_code и log_pattern присылает сервер клиента.
    ErrorKind:
      type: [string, "null"]
      pattern: "^[a-z_]{1,40}$"
      description: |
        Класс ошибки: timeout, dns, connection, tls, http_status, content, slow, cert_expiring,
        cert_expired, exit_code, log_match, missed, internal.
    Details:
      type: [object, "null"]
      description: |
        Подробности результата. http — url, method, status_code, reason, latency_ms, content_type, body_excerpt;
        tls — host, port, not_after, days_left, issuer, subject; tcp — host, port;
        exit_code — exit_code, command, duration_ms, stderr_tail; log_pattern — pattern, lines.
    Block:
      type: object
      required:
        [
          id,
          kind,
          name,
          description,
          x,
          y,
          status,
          reason,
          checks_total,
          checks_problem,
        ]
      properties:
        id:
          type: integer
        kind:
          $ref: "#/components/schemas/BlockKind"
        name:
          type: string
        description:
          type: [string, "null"]
        x:
          type: number
        y:
          type: number
        status:
          $ref: "#/components/schemas/BlockStatus"
        reason:
          type: [string, "null"]
          description: Причина статуса одной строкой по самой тяжёлой проблемной проверке
        checks_total:
          type: integer
          minimum: 0
        checks_problem:
          type: integer
          minimum: 0
    BlockCreate:
      type: object
      required: [kind, name]
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/BlockKind"
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, "null"]
        x:
          type: number
          default: 0
        y:
          type: number
          default: 0
    BlockUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, "null"]
        x:
          type: number
        y:
          type: number
    Link:
      type: object
      required: [id, source_block_id, target_block_id, label]
      properties:
        id:
          type: integer
        source_block_id:
          type: integer
        target_block_id:
          type: integer
        label:
          type: [string, "null"]
    LinkCreate:
      type: object
      required: [source_block_id, target_block_id]
      additionalProperties: false
      properties:
        source_block_id:
          type: integer
        target_block_id:
          type: integer
        label:
          type: [string, "null"]
          maxLength: 100
    Graph:
      type: object
      required: [project_id, project_name, generated_at, blocks, links]
      properties:
        project_id:
          type: integer
        project_name:
          type: string
        generated_at:
          type: string
          format: date-time
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/Block"
        links:
          type: array
          items:
            $ref: "#/components/schemas/Link"
    ProbeResult:
      type: object
      required: [health_check_id, status, checked_at]
      additionalProperties: false
      properties:
        health_check_id:
          type: integer
        status:
          $ref: "#/components/schemas/CheckStatus"
        checked_at:
          type: string
          format: date-time
        latency_ms:
          type: [integer, "null"]
          minimum: 0
        message:
          type: [string, "null"]
          maxLength: 2000
        error_kind:
          $ref: "#/components/schemas/ErrorKind"
        details:
          $ref: "#/components/schemas/Details"
    ProbeBatch:
      type: object
      required: [results]
      additionalProperties: false
      properties:
        results:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/ProbeResult"
    ProbeAccepted:
      type: object
      required: [accepted, status_changes]
      properties:
        accepted:
          type: integer
        status_changes:
          type: array
          items:
            type: object
            required: [block_id, previous, current]
            properties:
              block_id:
                type: integer
              previous:
                $ref: "#/components/schemas/BlockStatus"
              current:
                $ref: "#/components/schemas/BlockStatus"
    CheckResult:
      type: object
      required: [checked_at, status, latency_ms, message, error_kind, details]
      properties:
        checked_at:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/CheckStatus"
        latency_ms:
          type: [integer, "null"]
        message:
          type: [string, "null"]
        error_kind:
          $ref: "#/components/schemas/ErrorKind"
        details:
          $ref: "#/components/schemas/Details"
    HistoryPoint:
      type: object
      required: [checked_at, status, latency_ms]
      properties:
        checked_at:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/CheckStatus"
        latency_ms:
          type: [integer, "null"]
    Check:
      type: object
      required:
        [
          id,
          title,
          name,
          method,
          target,
          interval_sec,
          timeout_sec,
          enabled,
          config,
          status,
          reason,
          error_kind,
          last,
          history,
        ]
      properties:
        id:
          type: integer
        title:
          type: string
          description: Имя проверки, а если его нет — тип и цель
        name:
          type: [string, "null"]
        method:
          $ref: "#/components/schemas/CheckMethod"
        target:
          type: string
        interval_sec:
          type: integer
        timeout_sec:
          type: integer
        enabled:
          type: boolean
        config:
          type: object
        status:
          $ref: "#/components/schemas/BlockStatus"
        reason:
          type: [string, "null"]
        error_kind:
          $ref: "#/components/schemas/ErrorKind"
        last:
          oneOf:
            - $ref: "#/components/schemas/CheckResult"
            - type: "null"
        history:
          type: array
          maxItems: 40
          items:
            $ref: "#/components/schemas/HistoryPoint"
    ScopeAccess:
      type: string
      enum: [read, write]
      description: read — агент читает, write — читает и пишет
    Scope:
      type: object
      required: [id, path_glob, access]
      properties:
        id:
          type: integer
        path_glob:
          type: string
        access:
          $ref: "#/components/schemas/ScopeAccess"
    ScopeCreate:
      type: object
      required: [path_glob]
      additionalProperties: false
      properties:
        path_glob:
          type: string
          minLength: 1
          maxLength: 300
        access:
          $ref: "#/components/schemas/ScopeAccess"
    ScopeUpdate:
      type: object
      required: [access]
      additionalProperties: false
      properties:
        access:
          $ref: "#/components/schemas/ScopeAccess"
    CheckCreate:
      type: object
      required: [method, target]
      additionalProperties: false
      properties:
        name:
          type: [string, "null"]
          maxLength: 120
        method:
          $ref: "#/components/schemas/CheckMethod"
        target:
          type: string
          minLength: 1
          maxLength: 500
          description: http — URL, tls — хост или хост:порт, tcp — хост:порт, остальные — свободный текст
        interval_sec:
          type: integer
          minimum: 10
          maximum: 604800
          default: 60
        timeout_sec:
          type: integer
          minimum: 1
          maximum: 60
          default: 10
        enabled:
          type: boolean
          default: true
        config:
          type: object
          description: |
            http — method (GET, HEAD), expect_status (до 10 кодов), contains (до 200 символов), warn_latency_ms;
            tls — warn_days (1–365, по умолчанию 14), fail_days (меньше warn_days, по умолчанию 3);
            остальные типы — пустой объект.
    CheckUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: [string, "null"]
          maxLength: 120
        target:
          type: string
          minLength: 1
          maxLength: 500
        interval_sec:
          type: integer
          minimum: 10
          maximum: 604800
        timeout_sec:
          type: integer
          minimum: 1
          maximum: 60
        enabled:
          type: boolean
        config:
          type: object
    BlockChecks:
      type: object
      required: [block_id, generated_at, checks]
      properties:
        block_id:
          type: integer
        generated_at:
          type: string
          format: date-time
        checks:
          type: array
          items:
            $ref: "#/components/schemas/Check"
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
