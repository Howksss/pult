openapi: 3.1.0
info:
  title: Pult API
  version: 1.1.0
  license:
    name: MIT
    identifier: MIT
  description: |
    Контракт API Pult версии 1. Источник истины для backend, frontend, probe и коллекции Bruno: сначала меняется этот файл, потом код. Тесты backend сверяют каждый ответ с контрактом.
    Несовместимые изменения выпускаются как /api/v2, совместимые — как новые поля и эндпоинты в v1 (журнал: docs/api/changelog.md).
    Аутентификация: cookie сессии для интерфейса или заголовок X-API-Key для интеграций; probe — X-Probe-Token. 401 — не удалось установить, кто вы; 403 — роли в проекте не хватает.
    Ошибки возвращаются в формате application/problem+json (RFC 9457): type, title, status, detail и для ошибок проверки — errors. 400 — тело не является JSON, 422 — JSON не прошёл проверку по схеме.
    Списки: пагинация limit и offset, общее число в заголовке X-Total-Count, фильтры в параметрах запроса.
servers:
  - url: http://localhost:8000
    description: Локальный стенд разработчика
  - url: http://127.0.0.1:4010
    description: Mock-сервер Prism по этому контракту
  - url: https://pultops.ru
    description: Рабочий сервер
tags:
  - name: graph
    description: Граф системы клиента
  - name: checks
    description: Проверки блока и подробности ошибок
  - name: scopes
    description: Область доступа агента — пути репозитория
  - name: probe
    description: Приём результатов проверок с сервера клиента
  - name: service
    description: Служебные эндпоинты
  - name: projects
    description: Проекты и участники
  - name: auth
    description: Вход, выход и API-ключи
paths:
  /api/health:
    get:
      tags: [service]
      operationId: health
      security: []
      summary: Проверка работоспособности API
      responses:
        "200":
          description: API работает
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/ready:
    get:
      tags: [service]
      operationId: ready
      security: []
      summary: Готовность к работе, включая доступность БД
      responses:
        "200":
          description: API и БД доступны
          content:
            application/json:
              schema:
                type: object
                required: [status, database]
                properties:
                  status:
                    type: string
                    const: ready
                  database:
                    type: string
                    const: ok
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: БД недоступна
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/projects/{project_id}/graph:
    get:
      tags: [graph]
      operationId: getProjectGraph
      security:
        - userSession: []
        - apiKey: []
      summary: Граф проекта со статусами блоков
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Блоки, связи и статусы
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Graph"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/projects/{project_id}/blocks:
    post:
      tags: [graph]
      operationId: createBlock
      security:
        - userSession: []
        - apiKey: []
      summary: Добавить блок
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockCreate"
      responses:
        "201":
          description: Блок создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Block"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [graph]
      operationId: listBlocks
      security:
        - userSession: []
        - apiKey: []
      summary: Блоки проекта с фильтрами и пагинацией
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: kind
          in: query
          required: false
          description: Только блоки этого типа
          schema:
            $ref: "#/components/schemas/BlockKind"
        - name: status
          in: query
          required: false
          description: Только блоки с этим статусом
          schema:
            $ref: "#/components/schemas/BlockStatus"
        - name: q
          in: query
          required: false
          description: Часть имени блока, без учёта регистра
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: Готово
          headers:
            X-Total-Count:
              $ref: "#/components/headers/TotalCount"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Block"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/blocks/{block_id}:
    patch:
      tags: [graph]
      operationId: updateBlock
      security:
        - userSession: []
        - apiKey: []
      summary: Изменить имя, описание или положение блока
      parameters:
        - $ref: "#/components/parameters/BlockId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockUpdate"
      responses:
        "200":
          description: Блок изменён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Block"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [graph]
      operationId: deleteBlock
      security:
        - userSession: []
        - apiKey: []
      summary: Удалить блок вместе со связями и проверками
      parameters:
        - $ref: "#/components/parameters/BlockId"
      responses:
        "204":
          description: Блок удалён
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [graph]
      operationId: getBlock
      security:
        - userSession: []
        - apiKey: []
      summary: Блок со статусом и причиной
      parameters:
        - $ref: "#/components/parameters/BlockId"
      responses:
        "200":
          description: Готово
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Block"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/blocks/{block_id}/checks:
    get:
      tags: [checks]
      operationId: listBlockChecks
      security:
        - userSession: []
        - apiKey: []
      summary: Проверки блока с последним результатом и историей
      description: |
        Проблемные проверки идут первыми, выключенные — в конце.
        В истории до 40 последних результатов от старых к новым.
      parameters:
        - $ref: "#/components/parameters/BlockId"
      responses:
        "200":
          description: Проверки блока
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockChecks"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [checks]
      operationId: createCheck
      security:
        - userSession: []
        - apiKey: []
      summary: Добавить проверку блоку
      description: |
        Цель и настройки проверяются по типу. Адреса во внутренней сети (localhost, частные, link-local)
        отклоняются, если на сервере не включён ALLOW_PRIVATE_TARGETS.
      parameters:
        - $ref: "#/components/parameters/BlockId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckCreate"
      responses:
        "201":
          description: Проверка создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Check"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/checks/{check_id}:
    patch:
      tags: [checks]
      operationId: updateCheck
      security:
        - userSession: []
        - apiKey: []
      summary: Изменить проверку
      description: Тип проверки не меняется — для другого типа создаётся новая проверка.
      parameters:
        - $ref: "#/components/parameters/CheckId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckUpdate"
      responses:
        "200":
          description: Проверка изменена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Check"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [checks]
      operationId: deleteCheck
      security:
        - userSession: []
        - apiKey: []
      summary: Удалить проверку вместе с историей
      parameters:
        - $ref: "#/components/parameters/CheckId"
      responses:
        "204":
          description: Проверка удалена
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [checks]
      operationId: getCheck
      security:
        - userSession: []
        - apiKey: []
      summary: Проверка с последним результатом, историей и шкалой суток
      parameters:
        - $ref: "#/components/parameters/CheckId"
      responses:
        "200":
          description: Готово
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Check"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/checks/{check_id}/run:
    post:
      tags: [checks]
      operationId: runCheck
      security:
        - userSession: []
        - apiKey: []
      summary: Выполнить проверку сейчас
      description: Только для http, tls, tcp. Остальные присылает сервер клиента — ответ 409.
      parameters:
        - $ref: "#/components/parameters/CheckId"
      responses:
        "200":
          description: Проверка выполнена, результат записан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Check"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Проверку присылает сервер клиента, Pult её не выполняет
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/blocks/{block_id}/scopes:
    get:
      tags: [scopes]
      operationId: listScopes
      security:
        - userSession: []
        - apiKey: []
      summary: Область доступа блока
      parameters:
        - $ref: "#/components/parameters/BlockId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: access
          in: query
          required: false
          description: Только пути с этим правом
          schema:
            $ref: "#/components/schemas/ScopeAccess"
      responses:
        "200":
          description: Пути, отсортированные по алфавиту
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scope"
          headers:
            X-Total-Count:
              $ref: "#/components/headers/TotalCount"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [scopes]
      operationId: createScope
      security:
        - userSession: []
        - apiKey: []
      summary: Добавить путь в область блока
      description: |
        Путь — шаблон glob относительно корня репозитория: `*` — в пределах папки, `**` — любые вложенные папки,
        `?` — один символ. Путь с `/` на конце означает всю папку. Запрещены `/` в начале, `..`, `\` и буквы дисков.
      parameters:
        - $ref: "#/components/parameters/BlockId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScopeCreate"
      responses:
        "201":
          description: Путь добавлен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [scopes]
      operationId: replaceScopes
      security:
        - userSession: []
        - apiKey: []
      summary: Заменить область доступа блока целиком (только владелец)
      description: 'Идемпотентно: повтор того же запроса даёт то же состояние. Пустой список убирает все пути'
      parameters:
        - $ref: "#/components/parameters/BlockId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 100
              items:
                $ref: "#/components/schemas/ScopeCreate"
      responses:
        "200":
          description: Новая область блока
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/scopes/{scope_id}:
    patch:
      tags: [scopes]
      operationId: updateScope
      security:
        - userSession: []
        - apiKey: []
      summary: Сменить право на путь
      parameters:
        - $ref: "#/components/parameters/ScopeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScopeUpdate"
      responses:
        "200":
          description: Право изменено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [scopes]
      operationId: deleteScope
      security:
        - userSession: []
        - apiKey: []
      summary: Убрать путь из области
      parameters:
        - $ref: "#/components/parameters/ScopeId"
      responses:
        "204":
          description: Путь убран
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/projects/{project_id}/links:
    post:
      tags: [graph]
      operationId: createLink
      security:
        - userSession: []
        - apiKey: []
      summary: Соединить два блока проекта
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkCreate"
      responses:
        "201":
          description: Связь создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Link"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [graph]
      operationId: listLinks
      security:
        - userSession: []
        - apiKey: []
      summary: Связи проекта
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: block_id
          in: query
          required: false
          description: Только связи, где блок — источник или приёмник
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Готово
          headers:
            X-Total-Count:
              $ref: "#/components/headers/TotalCount"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Link"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/probe/results:
    post:
      tags: [probe]
      operationId: submitProbeResults
      summary: Принять пачку результатов проверок от probe
      description: |
        Probe на сервере клиента отправляет результаты пачкой.
        Токен проекта передаётся в заголовке X-Probe-Token и даёт право только на этот эндпоинт (NFR-S5).
        Пачка принимается целиком или отклоняется целиком. Если в ней есть проверка чужого проекта
        или несуществующая проверка, ответ 422 со списком таких health_check_id в errors.
        Probe должен убрать эти записи и повторить отправку остальных, иначе данные будут потеряны.
        Задания по расписанию и heartbeat отчитываются этим же запросом одной строкой curl в cron.
        Если такая проверка молчит дольше полутора интервалов, блок получает статус fail («пропущен запуск»).
      security:
        - probeToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProbeBatch"
      responses:
        "202":
          description: Результаты приняты
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      security: []
      summary: Зарегистрироваться и войти
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Registration"
      responses:
        "201":
          description: Готово
          content:
