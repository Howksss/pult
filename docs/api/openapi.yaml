components:
  securitySchemes:
    userSession:
      type: apiKey
      in: cookie
      name: pult_session
      description: 'Сессия после входа через интерфейс: cookie HttpOnly, SameSite=Lax, Secure, 30 дней'
    probeToken:
      type: apiKey
      in: header
      name: X-Probe-Token
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: API-ключ пользователя для интеграций и коллекции Bruno. Выпускается POST /api/v1/api-keys и показывается один раз, срок действия от 1 до 365 дней. Права те же, что у владельца ключа
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    BlockId:
      name: block_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ScopeId:
      name: scope_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    CheckId:
      name: check_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    LinkId:
      name: link_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    KeyId:
      name: key_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Limit:
      name: limit
      in: query
      required: false
      description: Сколько элементов вернуть
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    Offset:
      name: offset
      in: query
      required: false
      description: Сколько элементов пропустить
      schema:
        type: integer
        minimum: 0
        default: 0
  headers:
    TotalCount:
      description: Сколько элементов всего с учётом фильтров, без пагинации
      schema:
        type: integer
  responses:
    NotFound:
      description: Объект не найден
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Нарушена уникальность, например имя блока в проекте
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Токен probe не передан или неверен
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthenticated:
      description: Нет сессии или API-ключа, они истекли, или неверны email и пароль
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Роли в проекте не хватает для операции
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationError:
      description: Тело или параметры запроса не прошли проверку
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: Тело запроса не является корректным JSON
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Непредвиденная ошибка сервера. Подробности только в журнале сервера
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
    BlockKind:
      type: string
      enum: [server, scheduled_job, bot, integration, config, storage]
    BlockStatus:
      type: string
      enum: [ok, warn, fail, unknown]
    CheckStatus:
      type: string
      enum: [ok, warn, fail]
    CheckMethod:
      type: string
      enum: [heartbeat, http, log_pattern, exit_code, tls, tcp]
      description: |
        http, tls и tcp выполняет сам Pult. heartbeat, exit_code и log_pattern присылает сервер клиента.
    ErrorKind:
      type: [string, "null"]
      pattern: "^[a-z_]{1,40}$"
      description: |
        Класс ошибки: timeout, dns, connection, tls, http_status, content, slow, cert_expiring,
        cert_expired, exit_code, log_match, missed, internal.
    Details:
      type: [object, "null"]
      description: |
        Подробности результата. http — url, method, status_code, reason, latency_ms, content_type, body_excerpt;
        tls — host, port, not_after, days_left, issuer, subject; tcp — host, port;
        exit_code — exit_code, command, duration_ms, stderr_tail; log_pattern — pattern, lines.
    Block:
      type: object
      required: [id, kind, name, description, x, y, status, reason, checks_total, checks_problem]
      properties:
        id:
          type: integer
        kind:
          $ref: "#/components/schemas/BlockKind"
        name:
          type: string
        description:
          type: [string, "null"]
        x:
          type: number
        y:
          type: number
        status:
          $ref: "#/components/schemas/BlockStatus"
        reason:
          type: [string, "null"]
          description: Причина статуса одной строкой по самой тяжёлой проблемной проверке
        checks_total:
          type: integer
          minimum: 0
        checks_problem:
          type: integer
          minimum: 0
    BlockCreate:
      type: object
      required: [kind, name]
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/BlockKind"
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, "null"]
        x:
          type: number
          default: 0
        y:
          type: number
          default: 0
    BlockUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, "null"]
        x:
          type: number
        y:
          type: number
    Link:
      type: object
      required: [id, source_block_id, target_block_id, label]
      properties:
        id:
          type: integer
        source_block_id:
          type: integer
        target_block_id:
          type: integer
        label:
          type: [string, "null"]
    LinkCreate:
      type: object
      required: [source_block_id, target_block_id]
      additionalProperties: false
      properties:
        source_block_id:
          type: integer
        target_block_id:
          type: integer
        label:
          type: [string, "null"]
          maxLength: 100
    Graph:
      type: object
      required: [project_id, project_name, generated_at, blocks, links]
      properties:
        project_id:
          type: integer
        project_name:
          type: string
        generated_at:
          type: string
          format: date-time
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/Block"
        links:
          type: array
          items:
            $ref: "#/components/schemas/Link"
    ProbeResult:
      type: object
      required: [health_check_id, status, checked_at]
      additionalProperties: false
      properties:
        health_check_id:
          type: integer
        status:
          $ref: "#/components/schemas/CheckStatus"
        checked_at:
          type: string
          format: date-time
        latency_ms:
          type: [integer, "null"]
          minimum: 0
        message:
          type: [string, "null"]
          maxLength: 2000
        error_kind:
          $ref: "#/components/schemas/ErrorKind"
        details:
          $ref: "#/components/schemas/Details"
    ProbeBatch:
      type: object
      required: [results]
      additionalProperties: false
      properties:
        results:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/ProbeResult"
    ProbeAccepted:
      type: object
      required: [accepted, duplicates, status_changes]
      properties:
        accepted:
          type: integer
          description: Сколько результатов записано
        duplicates:
          type: integer
          description: 'Сколько результатов уже были записаны раньше и пропущены: повтор пачки безопасен'
        status_changes:
          type: array
          items:
            type: object
            required: [block_id, previous, current]
            properties:
              block_id:
                type: integer
              previous:
                $ref: "#/components/schemas/BlockStatus"
              current:
                $ref: "#/components/schemas/BlockStatus"
    CheckResult:
      type: object
      required: [checked_at, status, latency_ms, message, error_kind, details]
      properties:
        checked_at:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/CheckStatus"
        latency_ms:
          type: [integer, "null"]
        message:
          type: [string, "null"]
        error_kind:
          $ref: "#/components/schemas/ErrorKind"
        details:
          $ref: "#/components/schemas/Details"
    HistoryPoint:
      type: object
      required: [checked_at, status, latency_ms]
      properties:
        checked_at:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/CheckStatus"
        latency_ms:
          type: [integer, "null"]
    TimelineBucket:
      type: object
      required: [start, ok, warn, fail]
      properties:
        start:
          type: string
          format: date-time
        ok:
          type: integer
        warn:
          type: integer
        fail:
          type: integer
    Check:
      type: object
      required: [id, title, name, method, target, interval_sec, timeout_sec, enabled, config, status, reason, error_kind, last, history, timeline, failing_since]
      properties:
        id:
          type: integer
        title:
          type: string
          description: Имя проверки, а если его нет — тип и цель
        name:
          type: [string, "null"]
        method:
          $ref: "#/components/schemas/CheckMethod"
        target:
          type: string
        interval_sec:
          type: integer
        timeout_sec:
          type: integer
        enabled:
          type: boolean
        config:
          type: object
        status:
          $ref: "#/components/schemas/BlockStatus"
        reason:
          type: [string, "null"]
        error_kind:
          $ref: "#/components/schemas/ErrorKind"
        last:
          oneOf:
            - $ref: "#/components/schemas/CheckResult"
            - type: "null"
        history:
          type: array
          maxItems: 40
          items:
            $ref: "#/components/schemas/HistoryPoint"
        timeline:
          type: array
          description: 24 часовых отрезка, от старого к текущему; число результатов каждого статуса за час
          items:
            $ref: "#/components/schemas/TimelineBucket"
        failing_since:
          type: [string, "null"]
          format: date-time
          description: Начало текущей серии сбоев или предупреждений за последние сутки; null, если проверка в порядке
    ScopeAccess:
      type: string
      enum: [read, write]
      description: read — агент читает, write — читает и пишет
    Scope:
      type: object
      required: [id, path_glob, access]
      properties:
        id:
          type: integer
        path_glob:
          type: string
        access:
          $ref: "#/components/schemas/ScopeAccess"
    ScopeCreate:
      type: object
      required: [path_glob]
      additionalProperties: false
      properties:
        path_glob:
          type: string
          minLength: 1
          maxLength: 300
        access:
          $ref: "#/components/schemas/ScopeAccess"
    ScopeUpdate:
      type: object
      required: [access]
      additionalProperties: false
      properties:
        access:
          $ref: "#/components/schemas/ScopeAccess"
    CheckCreate:
      type: object
      required: [method, target]
      additionalProperties: false
      properties:
        name:
          type: [string, "null"]
          maxLength: 120
        method:
          $ref: "#/components/schemas/CheckMethod"
        target:
          type: string
          minLength: 1
          maxLength: 500
          description: http — URL, tls — хост или хост:порт, tcp — хост:порт, остальные — свободный текст
        interval_sec:
          type: integer
          minimum: 10
          maximum: 604800
          default: 60
        timeout_sec:
          type: integer
          minimum: 1
          maximum: 60
          default: 10
        enabled:
          type: boolean
          default: true
        config:
          type: object
          description: |
            http — method (GET, HEAD), expect_status (до 10 кодов), contains (до 200 символов), warn_latency_ms;
            tls — warn_days (1–365, по умолчанию 14), fail_days (меньше warn_days, по умолчанию 3);
            остальные типы — пустой объект.
    CheckUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: [string, "null"]
          maxLength: 120
        target:
          type: string
          minLength: 1
          maxLength: 500
        interval_sec:
          type: integer
          minimum: 10
          maximum: 604800
        timeout_sec:
          type: integer
          minimum: 1
          maximum: 60
        enabled:
          type: boolean
        config:
          type: object
    BlockChecks:
      type: object
      required: [block_id, generated_at, checks]
      properties:
        block_id:
          type: integer
        generated_at:
          type: string
          format: date-time
        checks:
          type: array
          items:
            $ref: "#/components/schemas/Check"
    MemberRole:
      type: string
      enum: [owner, developer, client]
      description: owner — настраивает всё, developer — смотрит и запускает проверки, client — смотрит
    Credentials:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 255
        password:
          type: string
          minLength: 1
          maxLength: 200
    Registration:
      type: object
      required: [email, password, full_name]
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 255
        password:
          type: string
          minLength: 10
          maxLength: 200
        full_name:
          type: string
          minLength: 1
          maxLength: 150
    MemberProject:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          $ref: "#/components/schemas/MemberRole"
    Me:
      type: object
      required: [id, email, full_name, projects]
      properties:
        id:
          type: integer
        email:
          type: string
        full_name:
          type: string
        projects:
          type: array
          items:
            $ref: "#/components/schemas/MemberProject"
    ProjectCreate:
      type: object
