      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        repo_full_name:
          type: string
          maxLength: 200
          pattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
    ProjectCreated:
      type: object
      required: [id, name, role, probe_token]
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          $ref: "#/components/schemas/MemberRole"
        probe_token:
          type: string
          description: Показывается один раз, в базе хранится только SHA-256
    Member:
      type: object
      required: [user_id, email, full_name, role]
      properties:
        user_id:
          type: integer
        email:
          type: string
        full_name:
          type: string
        role:
          $ref: "#/components/schemas/MemberRole"
    MemberAdd:
      type: object
      required: [email, role]
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 255
        role:
          $ref: "#/components/schemas/MemberRole"
    MemberUpdate:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/MemberRole"
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
    Project:
      type: object
      required: [id, name, role, description, repo_full_name, default_branch, created_at]
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          $ref: "#/components/schemas/MemberRole"
        description:
          type: [string, "null"]
        repo_full_name:
          type: string
        default_branch:
          type: string
        created_at:
          type: string
          format: date-time
    ProjectUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: [string, "null"]
        default_branch:
          type: string
          minLength: 1
          maxLength: 100
    LinkUpdate:
      type: object
      required: [label]
      additionalProperties: false
      properties:
        label:
          type: [string, "null"]
          maxLength: 100
    ApiKey:
      type: object
      required: [id, name, prefix, created_at, expires_at, last_used_at]
      properties:
        id:
          type: integer
        name:
          type: string
        prefix:
          type: string
          description: Начало ключа, чтобы узнать его в списке
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
    ApiKeyCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 365
          default: 90
    ApiKeyCreated:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: Сам ключ. Показывается только в этом ответе
