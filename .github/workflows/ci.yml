name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pult
          POSTGRES_PASSWORD: pult
          POSTGRES_DB: pult
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pult"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://pult:pult@localhost:5432/pult
      TEST_DATABASE_URL: postgresql+psycopg://pult:pult@localhost:5432/pult
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: migrations
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check
      - run: pytest

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  database:
    name: database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pult
          POSTGRES_PASSWORD: pult
          POSTGRES_DB: pult
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pult"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://pult:pult@localhost:5432/pult
      PGHOST: localhost
      PGUSER: pult
      PGPASSWORD: pult
      PGDATABASE: pult
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: alembic upgrade head
        working-directory: backend
      - run: psql -X -q -v ON_ERROR_STOP=1 -f backend/scripts/seed_demo.sql
      - run: psql -X -c "select name, status from v_block_status order by block_id"
      - name: backup, restore, verify
        run: |
          file="$(deploy/db/backup.sh)"
          deploy/db/restore.sh "$file" pult_restore
          deploy/db/verify.sh pult pult_restore

  hooks:
    name: hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pre-commit==4.0.1
      - run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: ruff,ruff-format,eslint,prettier
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: lint API contract
        run: npx --yes @redocly/cli@1.25.15 lint docs/api/openapi.yaml

  commits:
    name: commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save @commitlint/cli@19 @commitlint/config-conventional@19
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
