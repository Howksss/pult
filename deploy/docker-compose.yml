services:
  db:
    image: postgres:16-alpine
    env_file: ../.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ../backend
    env_file: ../.env
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    build: ../frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
