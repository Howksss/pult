limit_req_zone $binary_remote_addr zone=pult_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=pult_probe:10m rate=2r/s;

upstream pult_web {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name pult.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pult.example.com;

    ssl_certificate /etc/letsencrypt/live/pult.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pult.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 1m;
    limit_req_status 429;

    auth_basic "Pult";
    auth_basic_user_file /etc/nginx/pult.htpasswd;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location /api/v1/probe/ {
        auth_basic off;
        limit_req zone=pult_probe burst=10 nodelay;
        proxy_pass http://pult_web;
    }

    location = /api/health {
        auth_basic off;
        proxy_pass http://pult_web;
    }

    location /api/ {
        limit_req zone=pult_api burst=60 nodelay;
        proxy_pass http://pult_web;
    }

    location / {
        proxy_pass http://pult_web;
    }
}
